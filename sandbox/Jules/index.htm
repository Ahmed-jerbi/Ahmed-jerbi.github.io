<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le monde de Jules</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root { --green:#076134; --ink:#333; --line:#cfcfcf; }
* { box-sizing:border-box; }
body { margin:0; font-family:'Inter',sans-serif; background:linear-gradient(180deg,#f7f5f2,#fff); color:var(--ink); overflow-x:hidden; }
button,input,textarea { font:inherit; }
.hero { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; flex-direction:column; padding:20px; animation:fadeIn 2s ease; }
.hero h1 { font-family:'Playfair Display',serif; font-size:clamp(2.4rem,8vw,3.4rem); margin:0 0 10px; }
.hero p { opacity:.7; }
.scroll { margin-top:40px; font-size:.9rem; opacity:.5; }
.timeline { --axis:130px; position:relative; max-width:700px; margin:0 auto; padding:80px 20px 50px; }
.timeline::before { content:''; position:absolute; left:calc(20px + var(--axis)); inset-block:0; width:1px; background:var(--line); border-radius:2px; }
.event { position:relative; margin-bottom:60px; opacity:0; transform:translateY(40px); transition:all .8s ease; padding-left:calc(var(--axis) + 30px); }
.event.visible { opacity:1; transform:translateY(0); }
.dynamic-event { cursor:pointer; }
.dynamic-event:focus-visible { outline:2px solid var(--green); outline-offset:6px; }
.event::before { content:''; position:absolute; left:calc(var(--axis) - 5px); top:5px; width:10px; height:10px; background:var(--green); border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 2px var(--green); }
.event::after { content:''; position:absolute; left:calc(var(--axis) + 7px); top:10px; width:19px; height:1px; background:var(--green); }
.event h3 { font-family:'Playfair Display',serif; margin:0 0 8px; }
.event-date { position:absolute; left:0; top:2px; width:calc(var(--axis) - 36px); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; font-size:.85rem; opacity:.7; }
.event-date::after { content:''; position:absolute; left:calc(100% + 10px); top:8px; width:19px; height:1px; background:var(--green); }
.event-age { display:block; margin:0 0 10px; font-size:.82rem; color:var(--green); }
.event p { margin:5px 0; white-space:pre-wrap; }
.media-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.thumbnail { width:110px; height:68px; object-fit:cover; cursor:pointer; border-radius:6px; border:1px solid #ccc; background:#eee; padding:0; overflow:hidden; }
.thumbnail img,.thumbnail video { width:100%; height:100%; display:block; object-fit:cover; }
.audio-thumbnail { display:grid; place-items:center; background:linear-gradient(135deg,#edf5f1,#d8e9e0); color:var(--green); font-size:1.7rem; }
.entry-actions { display:none; gap:8px; margin-top:12px; }
body.editing .dynamic-event .entry-actions { display:flex; }
.small-btn { border:1px solid #d2d2d2; background:#fff; border-radius:999px; padding:7px 11px; cursor:pointer; }
.small-btn.danger { color:#a12a2a; }
.toolbar { display:flex; justify-content:center; gap:10px; padding:0 20px 28px; }
.toolbar-btn { display:grid; place-items:center; width:36px; height:36px; border:0; border-radius:50%; padding:0; background:var(--green); color:#fff; box-shadow:0 5px 16px rgba(0,0,0,.14); cursor:pointer; }
.toolbar-btn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.toolbar-btn:hover,.toolbar-btn:focus-visible,.toolbar-btn.active { background:#054c29; transform:translateY(-1px); }
.modal { display:none; position:fixed; z-index:999; inset:0; background:rgba(0,0,0,.7); align-items:center; justify-content:center; padding:18px; }
.modal.open { display:flex; }
.modal-card { position:relative; background:#fff; width:min(560px,100%); max-height:90vh; border-radius:12px; overflow:auto; padding:24px; box-shadow:0 18px 70px rgba(0,0,0,.28); }
body.viewer-open { overflow:hidden; }
.post-viewer { padding:0; background:#f7f5f2; color:var(--ink); overscroll-behavior:contain; }
.post-stage { --rail-width:38px; position:relative; display:flex; flex-direction:column; width:100%; height:100vh; height:100dvh; background:linear-gradient(180deg,#f7f5f2,#fff); }
.post-visual { position:relative; flex:1; min-height:0; display:flex; }
.post-media { flex:1; min-width:0; min-height:0; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr); place-items:center; overflow:hidden; padding:50px 20px 0; touch-action:none; }
.post-timeline { position:absolute; z-index:2; left:12px; top:calc(64px + env(safe-area-inset-top)); bottom:12px; width:var(--rail-width); overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; scrollbar-width:none; border-radius:20px; background:linear-gradient(90deg,rgba(255,255,255,.6),rgba(255,255,255,.08)); }
.post-timeline::-webkit-scrollbar { display:none; }
.post-timeline-list { position:relative; min-height:100%; padding:8px 0; }
.post-timeline-list::before { content:''; position:absolute; top:0; bottom:0; left:18px; width:1px; background:rgba(7,97,52,.4); }
.post-timeline-item { position:relative; display:block; width:100%; min-height:42px; padding:0; border:0; background:transparent; cursor:pointer; }
.post-timeline-item::before { content:''; position:absolute; left:14px; top:calc(50% - 5px); width:9px; height:9px; border:2px solid #fff; border-radius:50%; background:#adb9ae; box-shadow:0 0 0 1px #adb9ae; transition:background .2s ease,transform .2s ease; }
.post-timeline-item.active::before { background:var(--green); box-shadow:0 0 0 1px var(--green); transform:scale(1.25); }
.post-timeline-item:focus-visible { outline:2px solid var(--green); outline-offset:-2px; border-radius:4px; }
.post-timeline-bubble { position:absolute; z-index:3; left:calc(var(--rail-width) + 22px); top:0; padding:7px 11px; border:1px solid rgba(7,97,52,.18); border-radius:999px; background:rgba(255,255,255,.92); color:var(--green); box-shadow:0 4px 14px rgba(0,0,0,.07); font-size:.75rem; white-space:nowrap; pointer-events:none; opacity:0; transform:translate(-5px,-50%); transition:opacity .25s ease,transform .25s ease; }
.post-stage.show-timeline-date .post-timeline-bubble { opacity:1; transform:translate(0,-50%); }
.post-media img,.post-media video { display:block; min-width:0; min-height:0; width:100%; height:100%; object-fit:contain; }
.post-media > * { animation:postAppear .28s ease both; }
.post-audio { width:min(480px,100%); display:grid; justify-items:center; gap:28px; }
.post-audio span { font-size:clamp(4rem,18vw,8rem); color:var(--green); }
.post-audio audio { width:100%; }
.post-empty { color:#777; }
.post-copy { position:relative; z-index:1; flex:none; width:100%; max-height:min(38dvh,320px); overflow-y:auto; overscroll-behavior:contain; padding:26px max(24px,calc((100vw - 720px)/2)) max(28px,env(safe-area-inset-bottom)); background:linear-gradient(180deg,rgba(247,245,242,.78),#fff 28%); }
.post-meta { display:flex; flex-wrap:wrap; gap:6px; color:#657467; font-size:.85rem; }
.post-copy h2 { margin:10px 0 8px; font-family:'Playfair Display',serif; font-size:clamp(1.5rem,5vw,2.2rem); }
.post-copy p { margin:0; line-height:1.5; white-space:pre-wrap; }
.post-counter { position:absolute; z-index:2; top:calc(19px + env(safe-area-inset-top)); left:22px; font-size:.84rem; letter-spacing:.08em; color:var(--green); }
.post-dots { display:flex; justify-content:center; gap:6px; margin-bottom:15px; }
.post-dots[hidden] { display:none; }
.post-dot { width:18px; height:6px; padding:0; border:0; border-radius:99px; background:#cdd8cf; cursor:pointer; }
.post-dot.active { background:var(--green); }
.post-nav,.post-close { position:absolute; z-index:3; display:grid; place-items:center; width:42px; height:42px; padding:0; border:1px solid rgba(7,97,52,.22); border-radius:50%; background:rgba(255,255,255,.88); color:var(--green); box-shadow:0 4px 14px rgba(0,0,0,.07); cursor:pointer; line-height:1; }
.post-nav { font-size:1.75rem; }
.post-nav:disabled { opacity:.3; cursor:default; }
.post-prev-media { left:calc(var(--rail-width) + 18px); top:45%; }
.post-next-media { right:12px; top:45%; }
.post-prev-entry { right:16px; top:calc(74px + env(safe-area-inset-top)); }
.post-next-entry { right:16px; top:calc(124px + env(safe-area-inset-top)); }
.post-close { top:calc(17px + env(safe-area-inset-top)); right:16px; font-size:1.6rem; }
@keyframes postAppear { from { opacity:.4; transform:scale(.985); } to { opacity:1; transform:scale(1); } }
.modal-close { position:absolute; z-index:2; top:8px; right:10px; width:36px; height:36px; border:0; border-radius:50%; background:rgba(255,255,255,.9); font-size:1.5rem; cursor:pointer; }
.form-card h2 { margin:0 40px 22px 0; font-family:'Playfair Display',serif; }
.field { display:grid; gap:7px; margin-bottom:16px; }
.field label { font-size:.85rem; font-weight:500; }
.field input,.field textarea { width:100%; border:1px solid #ccc; border-radius:8px; padding:11px; background:#fff; }
.field textarea { min-height:90px; resize:vertical; }
.hint { margin:-8px 0 16px; font-size:.78rem; color:#777; }
.form-status { min-height:20px; margin:4px 0 14px; font-size:.88rem; color:#a12a2a; }
.submit-btn { width:100%; border:0; border-radius:9px; padding:13px; background:var(--green); color:#fff; cursor:pointer; font-weight:500; }
.submit-btn:disabled { opacity:.6; cursor:wait; }
.load-status { display:none; padding-left:calc(var(--axis) + 30px); color:#777; font-size:.85rem; }
.load-status.show { display:block; }
footer { text-align:center; font-size:.55rem; color:#666; padding:12px 0; border-top:1px solid rgba(50,50,50,.06); }
body:not(.unlocked) .timeline,body:not(.unlocked) .toolbar,body:not(.unlocked) footer { display:none; }
.access-screen { display:flex; justify-content:center; padding:36px 20px 80px; }
body.unlocked .access-screen { display:none; }
.access-card { width:min(340px,100%); background:#fff; border-radius:14px; padding:24px; text-align:center; box-shadow:0 14px 45px rgba(0,0,0,.09); }
.access-card #accessTitle { margin:0 0 18px; color:var(--ink); font-size:.95rem; line-height:1.5; }
.access-card .field { text-align:left; margin-bottom:0; }
.pin-row { display:flex; gap:6px; }
.pin-input-wrap { position:relative; flex:1; min-width:0; }
.pin-input-wrap input { width:100%; padding-right:42px; }
.pin-visibility { position:absolute; top:50%; right:4px; transform:translateY(-50%); width:36px; height:36px; display:grid; place-items:center; border:0; background:transparent; color:#666; cursor:pointer; }
.pin-submit { flex:0 0 42px; display:grid; place-items:center; border:1px solid var(--green); border-radius:8px; background:var(--green); color:#fff; cursor:pointer; font-size:1.5rem; line-height:1; }
.pin-visibility svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.pin-visibility .eye-slash { display:none; }
.pin-visibility[aria-pressed="true"] .eye-slash { display:block; }
.pin-submit:disabled { opacity:.6; cursor:wait; }
#accessStatus { min-height:0; margin:8px 0 0; }
#accessStatus:empty { display:none; }
body.memory-reveal::after { content:''; position:fixed; inset:0; z-index:998; pointer-events:none; background:radial-gradient(ellipse at 50% 70%,rgba(187,224,204,.65),transparent 64%),linear-gradient(115deg,transparent 30%,rgba(255,255,255,.82) 49%,transparent 68%); animation:memoryLight 1.6s ease-out both; }
body.memory-reveal .timeline::before { transform-origin:top; animation:memoryLine 1.25s cubic-bezier(.2,.7,.2,1) both; }
.timeline::after { content:''; position:absolute; top:10px; left:0; width:100%; height:210px; pointer-events:none; opacity:0; background:radial-gradient(circle at 16% 32%,#d5e9c9 0 2px,transparent 5px),radial-gradient(circle at 72% 18%,#badbc6 0 2px,transparent 5px),radial-gradient(circle at 84% 69%,#f4e7b8 0 2px,transparent 5px); }
body.memory-reveal .timeline::after { animation:memorySparkle 1.55s ease-out both; }
body.memory-reveal .dynamic-event.visible { animation:memoryCard .85s cubic-bezier(.16,.8,.25,1) both; }
body.memory-reveal .dynamic-event.visible:nth-child(2) { animation-delay:.14s; }
body.memory-reveal .dynamic-event.visible:nth-child(3) { animation-delay:.28s; }
body.memory-reveal .dynamic-event.visible:nth-child(n+4) { animation-delay:.4s; }
@keyframes memoryLight { 0%{opacity:0;transform:translateY(8%) scale(1.08)} 25%{opacity:.85} 100%{opacity:0;transform:translateY(-5%) scale(1)} }
@keyframes memoryLine { from{transform:scaleY(0);opacity:.2} to{transform:scaleY(1);opacity:1} }
@keyframes memorySparkle { 0%,15%{opacity:0;transform:translateY(15px)} 45%{opacity:.9} 100%{opacity:0;transform:translateY(-20px)} }
@keyframes memoryCard { from{opacity:0;transform:translateY(30px) scale(.98)} to{opacity:1;transform:translateY(0) scale(1)} }
@media (max-width:520px) {
  .timeline { --axis:108px; }
  .post-stage { --rail-width:34px; }
  .post-timeline { left:4px; }
  .post-timeline-list::before { left:16px; }
  .post-timeline-item::before { left:12px; }
  .post-timeline-bubble { left:calc(var(--rail-width) + 10px); }
  .post-media { padding-left:12px; padding-right:12px; }
  .post-prev-media { left:calc(var(--rail-width) + 4px); }
  .event { padding-left:calc(var(--axis) + 24px); }
  .event::after { width:13px; }
  .event-date { font-size:.7rem; }
  .load-status { padding-left:calc(var(--axis) + 24px); }
}
@media (prefers-reduced-motion:reduce) {
  .post-media > * { animation:none; }
  .post-timeline-bubble { transition:none; }
  .hero,body.memory-reveal::after,body.memory-reveal .timeline::before,body.memory-reveal .timeline::after,body.memory-reveal .dynamic-event.visible { animation:none; }
  .event { transition:none; transform:none; }
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
</style>
</head>
<body>
<header class="hero">
  <h1>Bienvenue au monde de Jules</h1>
  <div class="scroll">&darr; Faites d&eacute;filer pour continuer</div>
</header>

<section class="access-screen" id="accessScreen" aria-labelledby="accessTitle">
  <div class="access-card">
    <p id="accessTitle">Entrez le code PIN pour acc&eacute;der aux souvenirs.</p>
    <form id="accessForm">
      <div class="field">
        <label for="viewerPin">Code PIN</label>
        <div class="pin-row">
          <div class="pin-input-wrap">
            <input id="viewerPin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{8,12}" minlength="8" maxlength="12" autocomplete="off" title="8 &agrave; 12 chiffres" required>
            <button class="pin-visibility" id="pinVisibilityButton" type="button" aria-label="Afficher le code PIN" aria-pressed="false" title="Afficher le code PIN">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 3 21 21"/></svg>
            </button>
          </div>
          <button class="pin-submit" id="accessButton" type="submit" aria-label="Valider le code PIN" title="Valider le code PIN">&gt;</button>
        </div>
      </div>
      <p class="form-status" id="accessStatus" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

<main class="timeline">
  <div id="dynamicTimeline"></div>
  <p class="load-status" id="loadStatus"></p>
</main>

<div class="toolbar">
  <button class="toolbar-btn" id="editModeButton" type="button" aria-label="Modifier" title="Modifier">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </button>
  <button class="toolbar-btn" id="addButton" type="button" aria-label="Ajouter" title="Ajouter">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>
<footer>Made by <strong>Godfather - Ahmed Jerbi</strong>. © 2025 — All rights reserved. Reuse or republication prohibited.</footer>

<div class="modal post-viewer" id="viewerModal" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" tabindex="-1">
  <div class="post-stage">
    <div class="post-counter" id="viewerCounter"></div>
    <div class="post-visual">
      <nav class="post-timeline" aria-label="Chronologie des souvenirs">
        <div class="post-timeline-list" id="viewerTimeline"></div>
      </nav>
      <span class="post-timeline-bubble" id="viewerTimelineDate" aria-hidden="true"></span>
      <div class="post-media" id="viewerContent"></div>
    </div>
    <div class="post-copy">
      <div class="post-dots" id="viewerDots"></div>
      <div class="post-meta"><time id="viewerDate"></time><span aria-hidden="true">-</span><span id="viewerAge"></span></div>
      <h2 id="viewerTitle"></h2>
      <p id="viewerDescription"></p>
    </div>
    <button class="post-nav post-prev-media" id="previousMedia" type="button" aria-label="Média précédent">‹</button>
    <button class="post-nav post-next-media" id="nextMedia" type="button" aria-label="Média suivant">›</button>
    <button class="post-nav post-prev-entry" id="previousEntry" type="button" aria-label="Souvenir précédent">↑</button>
    <button class="post-nav post-next-entry" id="nextEntry" type="button" aria-label="Souvenir suivant">↓</button>
  </div>
  <button class="post-close" type="button" data-close="viewerModal" aria-label="Fermer">×</button>
</div>
<div class="modal" id="entryModal" role="dialog" aria-modal="true" aria-labelledby="entryModalTitle">
  <div class="modal-card form-card">
    <button class="modal-close" type="button" data-close="entryModal" aria-label="Fermer">×</button>
    <h2 id="entryModalTitle">Ajouter un souvenir</h2>
    <form id="entryForm">
      <div class="field"><label for="entryTitle">Titre</label><input id="entryTitle" name="title" maxlength="80" required></div>
      <div class="field"><label for="entryDate">Date</label><input id="entryDate" name="eventDate" type="date" required></div>
      <div class="field"><label for="entryDescription">Petit message</label><textarea id="entryDescription" name="description" maxlength="500"></textarea></div>
      <div class="field" id="fileField"><label for="entryFile">Photos, vidéos ou audios</label><input id="entryFile" name="files" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime,audio/mpeg,audio/mp4,audio/ogg,audio/wav,audio/webm"></div>
      <p class="hint" id="fileHint">Jusqu’à 10 fichiers et 50 Mo au total.</p>
      <p class="form-status" id="formStatus" role="status"></p>
      <button class="submit-btn" id="submitButton" type="submit">Ajouter à la timeline</button>
    </form>
  </div>
</div>

<script>
const projectUrl = 'https://olzpcvkddcdhzwyuwbpr.supabase.co';
const endpoint = `${projectUrl}/functions/v1/jules-media`;
const accessForm = document.getElementById('accessForm');
const accessStatus = document.getElementById('accessStatus');
const accessButton = document.getElementById('accessButton');
const pinInput = document.getElementById('viewerPin');
const pinVisibilityButton = document.getElementById('pinVisibilityButton');
const dynamicTimeline = document.getElementById('dynamicTimeline');
const loadStatus = document.getElementById('loadStatus');
const viewerModal = document.getElementById('viewerModal');
const viewerContent = document.getElementById('viewerContent');
const viewerTimeline = document.getElementById('viewerTimeline');
const viewerTimelineDate = document.getElementById('viewerTimelineDate');
const viewerDots = document.getElementById('viewerDots');
const viewerDate = document.getElementById('viewerDate');
const viewerAge = document.getElementById('viewerAge');
const viewerTitle = document.getElementById('viewerTitle');
const viewerDescription = document.getElementById('viewerDescription');
const viewerCounter = document.getElementById('viewerCounter');
const entryModal = document.getElementById('entryModal');
const entryForm = document.getElementById('entryForm');
const formStatus = document.getElementById('formStatus');
const submitButton = document.getElementById('submitButton');
const addButton = document.getElementById('addButton');
const editModeButton = document.getElementById('editModeButton');
const fileField = document.getElementById('fileField');
const fileHint = document.getElementById('fileHint');
let entries = [];
let editorPassphrase = '';
let viewerPin = '';
let animateAfterPin = false;
let currentPostIndex = -1;
let currentMediaIndex = 0;
let viewerReturnFocus = null;
let timelineDateTimer;
try { viewerPin = sessionStorage.getItem('julesViewerPin') || ''; } catch {}

function resetPinVisibility() {
  pinInput.type='password';
  pinVisibilityButton.setAttribute('aria-pressed','false');
  pinVisibilityButton.setAttribute('aria-label','Afficher le code PIN');
  pinVisibilityButton.title='Afficher le code PIN';
}

function lockScreen(message = '') {
  viewerPin = '';
  entries = [];
  dynamicTimeline.replaceChildren();
  document.body.classList.remove('unlocked', 'editing', 'memory-reveal');
  document.querySelectorAll('.modal.open').forEach(closeModal);
  accessStatus.textContent = message;
  resetPinVisibility();
  try { sessionStorage.removeItem('julesViewerPin'); } catch {}
}
let editingId = null;

const observer = new IntersectionObserver(items => items.forEach(item => {
  if (item.isIntersecting) item.target.classList.add('visible');
}), { threshold:.2 });
document.querySelectorAll('.event').forEach(event => observer.observe(event));

function showModal(modal) { modal.classList.add('open'); }
function closeModal(modal) {
  modal.classList.remove('open');
  if (modal !== viewerModal) return;
  document.body.classList.remove('viewer-open');
  clearTimeout(timelineDateTimer);
  viewerModal.querySelector('.post-stage').classList.remove('show-timeline-date');
  viewerContent.querySelectorAll('video,audio').forEach(media => media.pause());
  viewerContent.replaceChildren();
  currentPostIndex = -1;
  if (viewerReturnFocus?.isConnected) viewerReturnFocus.focus({preventScroll:true});
  viewerReturnFocus = null;
}
function showTimelineDate() {
  if (currentPostIndex < 0) return;
  const active = viewerTimeline.children[currentPostIndex];
  const rail = viewerTimeline.parentElement.getBoundingClientRect();
  const visual = viewerTimeline.closest('.post-visual').getBoundingClientRect();
  const dot = active.getBoundingClientRect();
  const dotCenter = dot.top + dot.height / 2;
  const stage = viewerModal.querySelector('.post-stage');
  viewerTimelineDate.textContent = formatDate(entries[currentPostIndex].eventDate);
  viewerTimelineDate.style.top = (dotCenter - visual.top) + 'px';
  stage.classList.toggle('show-timeline-date', dotCenter >= rail.top && dotCenter <= rail.bottom);
  clearTimeout(timelineDateTimer);
  timelineDateTimer = setTimeout(() => stage.classList.remove('show-timeline-date'), 3000);
}
viewerTimeline.parentElement.addEventListener('scroll', () => {
  if (viewerModal.classList.contains('open')) showTimelineDate();
});
function renderViewerTimeline() {
  viewerTimeline.replaceChildren();
  entries.forEach((entry, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'post-timeline-item';
    button.setAttribute('aria-label', formatDate(entry.eventDate) + ' : ' + entry.title);

    button.addEventListener('click', () => navigatePost(index - currentPostIndex));
    viewerTimeline.append(button);
  });
}
function syncViewerTimeline() {
  const buttons = viewerTimeline.querySelectorAll('.post-timeline-item');
  buttons.forEach((button, index) => {
    const active = index === currentPostIndex;
    button.classList.toggle('active', active);
    button.setAttribute('aria-current', String(active));
  });
  const active = buttons[currentPostIndex];
  if (active) {
    const rail = viewerTimeline.parentElement;
    rail.scrollTop = active.offsetTop + active.offsetHeight / 2 - rail.clientHeight / 2;
  }
}
function renderViewer() {
  const entry = entries[currentPostIndex];
  if (!entry) { closeModal(viewerModal); return; }
  const mediaFiles = entry.media || [];
  currentMediaIndex = Math.max(0, Math.min(currentMediaIndex, mediaFiles.length - 1));
  viewerContent.querySelectorAll('video,audio').forEach(media => media.pause());
  viewerContent.replaceChildren();
  const item = mediaFiles[currentMediaIndex];
  if (item) {
    if (item.type === 'audio') {
      const audioCard = document.createElement('div');
      audioCard.className = 'post-audio';
      const icon = document.createElement('span');
      icon.textContent = '♪';
      icon.setAttribute('aria-hidden', 'true');
      const audio = document.createElement('audio');
      audio.src = item.url;
      audio.controls = true;
      audio.autoplay = true;
      audioCard.append(icon, audio);
      viewerContent.append(audioCard);
    } else {
      const media = document.createElement(item.type === 'video' ? 'video' : 'img');
      media.src = item.url;
      if (item.type === 'image') media.alt = entry.title;
      else {
        media.controls = true;
        media.autoplay = true;
        media.playsInline = true;
      }
      viewerContent.append(media);
    }
  } else {
    const empty = document.createElement('p');
    empty.className = 'post-empty';
    empty.textContent = 'Aucun média pour ce souvenir.';
    viewerContent.append(empty);
  }
  viewerDate.dateTime = entry.eventDate;
  viewerDate.textContent = formatDate(entry.eventDate);
  viewerAge.textContent = formatAge(entry.eventDate);
  viewerTitle.textContent = entry.title;
  viewerDescription.textContent = entry.description || '';
  viewerCounter.textContent = (currentPostIndex + 1) + ' / ' + entries.length;
  viewerDots.replaceChildren();
  viewerDots.hidden = mediaFiles.length < 2;
  mediaFiles.forEach((file, index) => {
    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'post-dot' + (index === currentMediaIndex ? ' active' : '');
    dot.setAttribute('aria-label', 'Média ' + (index + 1) + ' sur ' + mediaFiles.length);
    dot.setAttribute('aria-current', index === currentMediaIndex ? 'true' : 'false');
    dot.addEventListener('click', () => { currentMediaIndex = index; renderViewer(); });
    viewerDots.append(dot);
  });
  document.getElementById('previousMedia').disabled = currentMediaIndex === 0;
  document.getElementById('nextMedia').disabled = currentMediaIndex >= mediaFiles.length - 1;
  document.getElementById('previousEntry').disabled = currentPostIndex === 0;
  document.getElementById('nextEntry').disabled = currentPostIndex >= entries.length - 1;
  syncViewerTimeline();
}
function openPost(index, mediaIndex = 0, trigger = document.activeElement) {
  if (index < 0 || index >= entries.length) return;
  viewerReturnFocus = trigger;
  currentPostIndex = index;
  currentMediaIndex = mediaIndex;
  document.body.classList.add('viewer-open');
  showModal(viewerModal);
  renderViewerTimeline();
  renderViewer();
  showTimelineDate();
  viewerModal.focus({preventScroll:true});
}
function navigatePost(direction) {
  const next = currentPostIndex + direction;
  if (next < 0 || next >= entries.length) return;
  currentPostIndex = next;
  currentMediaIndex = 0;
  renderViewer();
  showTimelineDate();
  viewerModal.querySelector('.post-copy').scrollTop = 0;
}
function navigateMedia(direction) {
  const next = currentMediaIndex + direction;
  if (next < 0 || next >= (entries[currentPostIndex]?.media?.length || 0)) return;
  currentMediaIndex = next;
  renderViewer();
}
document.getElementById('previousMedia').addEventListener('click', () => navigateMedia(-1));
document.getElementById('nextMedia').addEventListener('click', () => navigateMedia(1));
document.getElementById('previousEntry').addEventListener('click', () => navigatePost(-1));
document.getElementById('nextEntry').addEventListener('click', () => navigatePost(1));
document.addEventListener('click', event => {
  const closeButton = event.target.closest('[data-close]');
  if (closeButton) { closeModal(document.getElementById(closeButton.dataset.close)); return; }
  const article = event.target.closest('.dynamic-event');
  if (!article || event.target.closest('.entry-actions')) return;
  const thumbnail = event.target.closest('.thumbnail');
  openPost(Number(article.dataset.index), thumbnail ? Number(thumbnail.dataset.mediaIndex) : 0, thumbnail || article);
});
document.querySelectorAll('.modal').forEach(modal => modal.addEventListener('click', event => {
  if (event.target === modal) closeModal(modal);
}));
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    document.querySelectorAll('.modal.open').forEach(closeModal);
    return;
  }
  if (viewerModal.classList.contains('open')) {
    if (event.target.matches('audio,video')) return;
    const direction = {ArrowUp:-1, ArrowDown:1, ArrowLeft:-1, ArrowRight:1}[event.key];
    if (direction === undefined) return;
    event.preventDefault();
    if (event.key === 'ArrowUp' || event.key === 'ArrowDown') navigatePost(direction);
    else navigateMedia(direction);
    return;
  }
  if (event.target.classList?.contains('dynamic-event') && (event.key === 'Enter' || event.key === ' ')) {
    event.preventDefault();
    openPost(Number(event.target.dataset.index), 0, event.target);
  }
});
let wheelTotal = 0;
let wheelAxis = '';
let lastWheel = 0;
let wheelLockedUntil = 0;
viewerModal.addEventListener('wheel', event => {
  if (event.target.closest('.post-timeline')) return;
  const copy = event.target.closest('.post-copy');
  if (copy && Math.abs(event.deltaY) >= Math.abs(event.deltaX)) {
    const canScroll = event.deltaY > 0
      ? copy.scrollTop + copy.clientHeight < copy.scrollHeight - 2
      : copy.scrollTop > 2;
    if (canScroll) return;
  }
  event.preventDefault();
  const axis = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? 'horizontal' : 'vertical';
  const now = Date.now();
  if (now - lastWheel > 250 || axis !== wheelAxis) wheelTotal = 0;
  lastWheel = now;
  wheelAxis = axis;
  if (now < wheelLockedUntil) return;
  wheelTotal += axis === 'horizontal' ? event.deltaX : event.deltaY;
  if (Math.abs(wheelTotal) < 65) return;
  if (axis === 'horizontal') navigateMedia(wheelTotal > 0 ? 1 : -1);
  else navigatePost(wheelTotal > 0 ? 1 : -1);
  wheelTotal = 0;
  wheelLockedUntil = now + 650;
}, {passive:false});
let touchStart = null;
viewerModal.addEventListener('touchstart', event => {
  if (event.touches.length !== 1 || event.target.closest('button,audio,.post-timeline')) { touchStart = null; return; }
  touchStart = {
    x:event.touches[0].clientX,
    y:event.touches[0].clientY,
    inCopy:!!event.target.closest('.post-copy'),
  };
}, {passive:true});
viewerModal.addEventListener('touchend', event => {
  if (!touchStart || event.changedTouches.length !== 1) return;
  const dx = event.changedTouches[0].clientX - touchStart.x;
  const dy = event.changedTouches[0].clientY - touchStart.y;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) navigateMedia(dx < 0 ? 1 : -1);
  else if (Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx) * 1.2) {
    const copy = viewerModal.querySelector('.post-copy');
    if (!touchStart.inCopy || copy.scrollHeight <= copy.clientHeight + 2) navigatePost(dy < 0 ? 1 : -1);
  }
  touchStart = null;
}, {passive:true});
viewerModal.addEventListener('touchcancel', () => { touchStart = null; });

async function callJson(payload) {
  const headers = {'Content-Type':'application/json'};
  if (viewerPin) headers['x-jules-pin'] = viewerPin;
  const response = await fetch(endpoint, { method:'POST', headers, body:JSON.stringify(payload) });
  const result = await response.json().catch(() => ({}));
  if (!response.ok) {
    if (result.error === 'Code familial incorrect.') lockScreen('Code incorrect. Réessayez.');
    throw new Error(result.error || 'Une erreur est survenue.');
  }
  return result;
}
async function ensureEditor() {
  if (editorPassphrase) return true;
  const candidate = prompt('Mot de passe éditeur (pas le mot de passe de la base de données) :');
  if (!candidate) return false;
  try { await callJson({action:'authorize',passphrase:candidate}); editorPassphrase = candidate; return true; }
  catch (error) { alert(error.message); return false; }
}

function createMediaButton(media, mediaIndex) {
  const button = document.createElement('button');
  button.type = 'button'; button.className = `thumbnail${media.type === 'audio' ? ' audio-thumbnail' : ''}`;
  button.dataset.mediaIndex = String(mediaIndex);
  button.setAttribute('aria-label', media.type === 'audio' ? 'Écouter le souvenir' : 'Voir le souvenir');
  if (media.type === 'image') { const image=document.createElement('img'); image.src=media.url; image.alt=''; button.append(image); }
  else if (media.type === 'video') { const video=document.createElement('video'); video.src=media.url; video.muted=true; video.preload='metadata'; button.append(video); }
  else button.textContent = '♪';
  return button;
}
function formatDate(date) { return new Intl.DateTimeFormat('fr-FR',{timeZone:'UTC'}).format(new Date(`${date}T00:00:00Z`)); }
const julesBirthDate = '2025-09-26';
function formatAge(date) {
  if (date < julesBirthDate) return 'Avant sa naissance';
  const [year, month, day] = date.split('-').map(Number);
  const [birthYear, birthMonth, birthDay] = julesBirthDate.split('-').map(Number);
  let years = year - birthYear;
  let months = month - birthMonth;
  let days = day - birthDay;
  if (days < 0) {
    months -= 1;
    days += new Date(Date.UTC(year, month - 1, 0)).getUTCDate();
  }
  if (months < 0) {
    years -= 1;
    months += 12;
  }
  const parts = [];
  if (years) parts.push(years + ' an' + (years > 1 ? 's' : ''));
  if (months) parts.push(months + ' mois');
  if (days || !parts.length) parts.push(days + ' jour' + (days > 1 ? 's' : ''));
  return parts.join(', ');
}
function renderEntries() {
  dynamicTimeline.replaceChildren();
  entries.forEach((entry, index) => {
    const article=document.createElement('article'); article.className='event dynamic-event'; article.dataset.index=String(index); article.tabIndex=0; article.setAttribute('aria-label','Ouvrir ' + entry.title);
    const title=document.createElement('h3'); title.textContent=entry.title;
    const date=document.createElement('time'); date.className='event-date'; date.dateTime=entry.eventDate; date.textContent=formatDate(entry.eventDate);
    const age=document.createElement('span'); age.className='event-age'; age.textContent=formatAge(entry.eventDate);
    const description=document.createElement('p'); description.textContent=entry.description;
    const mediaRow=document.createElement('div'); mediaRow.className='media-row';
    entry.media.forEach((media, mediaIndex)=>mediaRow.append(createMediaButton(media, mediaIndex)));
    const actions=document.createElement('div'); actions.className='entry-actions';
    const edit=document.createElement('button'); edit.type='button'; edit.className='small-btn'; edit.textContent='Modifier'; edit.addEventListener('click',()=>openEdit(entry));
    const remove=document.createElement('button'); remove.type='button'; remove.className='small-btn danger'; remove.textContent='Supprimer'; remove.addEventListener('click',()=>deleteEntry(entry));
    actions.append(edit,remove); article.append(date,title,age,description,mediaRow,actions); dynamicTimeline.append(article); observer.observe(article);
  });
}
async function loadEntries() {
  if (!viewerPin) return false;
  loadStatus.classList.remove('show');
  try {
    const response=await fetch(endpoint,{headers:{'x-jules-pin':viewerPin}});
    const result=await response.json().catch(()=>({}));
    if (response.status === 401) {
      lockScreen('Code incorrect. Réessayez.');
      return false;
    }
    if (!response.ok) throw new Error(result.error||'Impossible de charger les souvenirs.');
    const showReveal=animateAfterPin && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    entries=(result.entries||[]).slice().reverse();
    renderEntries();
    document.body.classList.add('unlocked');
    if (showReveal) {
      requestAnimationFrame(()=>{
        document.body.classList.add('memory-reveal');
        document.querySelector('.timeline').scrollIntoView({behavior:'smooth',block:'start'});
        setTimeout(()=>document.body.classList.remove('memory-reveal'),1800);
      });
    }
    accessForm.reset();
    resetPinVisibility();
    try { sessionStorage.setItem('julesViewerPin',viewerPin); } catch {}
    accessStatus.textContent='';
    return true;
  } catch {
    if (document.body.classList.contains('unlocked')) {
      loadStatus.textContent='Les souvenirs ajoutés ne sont pas disponibles pour le moment.';
      loadStatus.classList.add('show');
    } else accessStatus.textContent='Les souvenirs ne sont pas disponibles pour le moment. Réessayez plus tard.';
    return false;
  }
}
function openAdd() {
  editingId=null; entryForm.reset(); document.getElementById('entryDate').valueAsDate=new Date();
  document.getElementById('entryModalTitle').textContent='Ajouter un souvenir'; submitButton.textContent='Ajouter à la timeline';
  document.getElementById('entryFile').required=true; fileField.hidden=false; fileHint.hidden=false;
  fileHint.textContent='Jusqu’à 10 fichiers et 50 Mo au total.';
  formStatus.textContent=''; showModal(entryModal);
}
function openEdit(entry) {
  editingId=entry.id; entryForm.reset(); document.getElementById('entryTitle').value=entry.title; document.getElementById('entryDate').value=entry.eventDate;
  document.getElementById('entryDescription').value=entry.description; document.getElementById('entryModalTitle').textContent='Modifier le souvenir';
  submitButton.textContent='Enregistrer'; document.getElementById('entryFile').required=false; fileField.hidden=false; fileHint.hidden=false;
  fileHint.textContent='Facultatif : sélectionner des fichiers remplacera tous les médias actuels.';
  formStatus.textContent=''; showModal(entryModal);
}
addButton.addEventListener('click',async()=>{ if(await ensureEditor()) openAdd(); });
editModeButton.addEventListener('click',async()=>{
  if(!document.body.classList.contains('editing') && !(await ensureEditor())) return;
  const editing=document.body.classList.toggle('editing');
  editModeButton.classList.toggle('active',editing);
  editModeButton.setAttribute('aria-pressed',String(editing));
  editModeButton.title=editing?'Terminer':'Modifier';
});
entryForm.addEventListener('submit',async event=>{
  event.preventDefault(); submitButton.disabled=true; formStatus.textContent=editingId?'Enregistrement…':'Envoi en cours…';
  try {
    const form=new FormData(entryForm); form.set('passphrase',editorPassphrase);
    if(editingId) { form.set('action','update'); form.set('id',editingId); }
    const response=await fetch(endpoint,{method:'POST',headers:{'x-jules-pin':viewerPin},body:form}); const result=await response.json().catch(()=>({}));
    if(!response.ok) {
      if(response.status===401 && result.error==='Code familial incorrect.') lockScreen('Code incorrect. Réessayez.');
      throw new Error(result.error||'L’envoi a échoué.');
    }
    closeModal(entryModal); await loadEntries();
  } catch(error) { if(/mot de passe/i.test(error.message)) editorPassphrase=''; formStatus.textContent=error.message; }
  finally { submitButton.disabled=false; }
});
async function deleteEntry(entry) {
  if(!confirm(`Supprimer « ${entry.title} » ? Cette action est définitive.`)) return;
  try { await callJson({action:'delete',id:entry.id,passphrase:editorPassphrase}); await loadEntries(); }
  catch(error) { alert(error.message); }
}
pinVisibilityButton.addEventListener('click',()=>{
  const visible=pinInput.type==='password';
  pinInput.type=visible?'text':'password';
  pinVisibilityButton.setAttribute('aria-pressed',String(visible));
  pinVisibilityButton.setAttribute('aria-label',visible?'Masquer le code PIN':'Afficher le code PIN');
  pinVisibilityButton.title=visible?'Masquer le code PIN':'Afficher le code PIN';
  pinInput.focus();
});
accessForm.addEventListener('submit',async event=>{
  event.preventDefault();
  accessButton.disabled=true;
  viewerPin=document.getElementById('viewerPin').value;
  accessStatus.textContent='Vérification du code…';
  animateAfterPin=true;
  try { await loadEntries(); }
  finally { animateAfterPin=false; accessButton.disabled=false; }
});
if (viewerPin) loadEntries();
</script>
