<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenue Jules</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(180deg, #f7f5f2, #ffffff);
  color: #333;
  overflow-x: hidden;
}

.hero {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  flex-direction: column;
  padding: 20px;
  animation: fadeIn 2s ease;
}

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 2.8rem;
  margin-bottom: 10px;
}

.hero p {
  opacity: 0.7;
}

.scroll {
  margin-top: 40px;
  font-size: 0.9rem;
  opacity: 0.5;
}

/* Timeline */
.timeline {
  position: relative;
  max-width: 700px;
  margin: 0 auto;
  padding: 80px 20px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 20px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: #cfcfcf;
  border-radius: 2px;
}

.event {
  position: relative;
  margin-bottom: 60px;
  opacity: 0;
  transform: translateY(40px);
  transition: all 0.8s ease;
  padding-left: 60px;
}

.event.visible {
  opacity: 1;
  transform: translateY(0);
}

.event::before {
  content: '';
  position: absolute;
  left: 22px;
  top: 5px;
  width: 10px;
  height: 10px;
  background: #076134;
  border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 0 0 2px #076134;
}

.event h3 {
  font-family: 'Playfair Display', serif;
  margin-bottom: 8px;
}

.event span {
  font-size: 0.85rem;
  opacity: 0.6;
}

.event p {
  margin-top: 5px;
}

.thumbnail {
  margin-top: 8px;
  width: 100px;
  height: 60px;
  object-fit: cover;
  cursor: pointer;
  border-radius: 4px;
  border: 1px solid #ccc;
}

/* Modal */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  left: 0; top: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  align-items: center;
  justify-content: center;
}

.modal-content {
  background: #fff;
  padding: 20px;
  max-width: 80%;
  max-height: 80%;
  border-radius: 8px;
  text-align: center;
  overflow: auto;
}

.modal-content img, .modal-content video {
  max-width: 100%;
  max-height: 70vh;
  border-radius: 6px;
}

.modal-close {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 1.5rem;
  cursor: pointer;
  color: #333;
}

.audio-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #fff;
  border-radius: 50px;
  padding: 12px 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.1);
  cursor: pointer;
  font-size: 0.85rem;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}
</style>
</head>
<body>

<div class="hero">
  <h1>Bienvenue au monde, Jules</h1>
  <p>25 septembre 2025</p>
  <div class="scroll">↓ Swipe pour un carnet de souvenirs</div>
</div>

<div class="timeline">

  <div class="event">
    <h3>Naissance</h3>
    <span>25.09.2025</span>
    <p>Jules est né à 3:45 du matin, pesant 3.2 kg et mesurant 50 cm.</p>
    <img src="Jules3.jpeg" class="thumbnail" data-type="image" data-src="Jules3.jpeg">
  </div>

  <div class="event">
    <h3>Première sortie au monde</h3>
    <span>29.09.2025</span>
    <p>Trajet Hôpital > Maison</p>
    <img src="Jules1.jpg" class="thumbnail" data-type="image" data-src="Jules1.jpg">
    <img src="Jules2.jpg" class="thumbnail" data-type="image" data-src="Jules2.jpg">
  </div>

    <div class="event">
    <h3>Premier Noël</h3>
    <span>28.12.2025</span>
    <p>Un moment magique en famille.</p>
    <img src="Jules1.jpg" class="thumbnail" data-type="image" data-src="Jules1.jpg">
    <img src="Jules2.jpg" class="thumbnail" data-type="image" data-src="Jules2.jpg">
  </div>

</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content" id="modalContent"></div>
  <div class="modal-close" onclick="closeModal()">×</div>
</div>

<script>
const events = document.querySelectorAll('.event');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.3 });

events.forEach(e => observer.observe(e));

/* Modal logic */
const modal = document.getElementById('modal');
const modalContent = document.getElementById('modalContent');

document.querySelectorAll('.thumbnail').forEach(item => {
  item.addEventListener('click', () => {
    const type = item.dataset.type;
    const src = item.dataset.src;
    modalContent.innerHTML = '';
    if(type === 'image'){
      const img = document.createElement('img');
      img.src = src;
      modalContent.appendChild(img);
    } else if(type === 'video'){
      const video = document.createElement('video');
      video.src = src;
      video.controls = true;
      video.autoplay = true;
      modalContent.appendChild(video);
    } else if(type === 'audio'){
      const audio = document.createElement('audio');
      audio.src = src;
      audio.controls = true;
      audio.autoplay = true;
      modalContent.appendChild(audio);
    }
    modal.style.display = 'flex';
  });
});

function closeModal(){
  modal.style.display = 'none';
  modalContent.innerHTML = '';
}

/* Close modal on click outside */
window.addEventListener('click', e => {
  if(e.target === modal) closeModal();
});
</script>

</body>
</html>
